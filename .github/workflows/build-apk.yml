name: Build & Release Android APK

on:
  push:
    branches: [ "main", "master", "OmniFinCalc" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main", "master", "OmniFinCalc" ]
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release Tag Name (e.g., v1.0.0)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build:
    name: Build & Publish APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Ensure google-services.json Exists
        run: |
          if [ ! -f "app/google-services.json" ] || ! grep -q "com.aistudio.allinonecalculator.yskcsg" "app/google-services.json"; then
            echo "Creating fallback google-services.json for package com.aistudio.allinonecalculator.yskcsg..."
            echo '{"project_info":{"project_number":"123456789012","project_id":"omnifincalc-app","storage_bucket":"omnifincalc-app.appspot.com"},"client":[{"client_info":{"mobilesdk_app_id":"1:123456789012:android:abcdef","android_client_info":{"package_name":"com.aistudio.allinonecalculator.yskcsg"}},"api_key":[{"current_key":"AIzaSyMockKeyForBuild123456789"}]},{"client_info":{"mobilesdk_app_id":"1:123456789012:android:fedcba","android_client_info":{"package_name":"com.example"}},"api_key":[{"current_key":"AIzaSyMockKeyForBuild123456789"}]}]}' > app/google-services.json
          fi

      - name: Ensure Debug Keystore Exists
        run: |
          if [ -f "debug.keystore.base64" ] && [ ! -f "debug.keystore" ]; then
            echo "Decoding debug.keystore from base64..."
            base64 -d debug.keystore.base64 > debug.keystore
          elif [ ! -f "debug.keystore" ]; then
            echo "Generating fallback debug.keystore..."
            keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run Unit Tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Prepare Named APK File
        run: |
          mkdir -p release-artifacts
          cp app/build/outputs/apk/debug/app-debug.apk release-artifacts/OmniFinCalc.apk

      - name: Upload APK to Actions Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: OmniFinCalc-APK
          path: release-artifacts/OmniFinCalc.apk
          retention-days: 30

      - name: Determine Release Tag
        id: release_tag
        if: github.event_name != 'pull_request'
        run: |
          if [ -n "${{ github.event.inputs.tag_name }}" ]; then
            echo "tag=${{ github.event.inputs.tag_name }}" >> $GITHUB_OUTPUT
          elif [[ "${{ github.ref }}" == refs/tags/* ]]; then
            echo "tag=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          else
            echo "tag=v1.0.${{ github.run_number }}" >> $GITHUB_OUTPUT
          fi

      - name: Publish to GitHub Releases
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_tag.outputs.tag }}
          name: "OmniFinCalc Release ${{ steps.release_tag.outputs.tag }}"
          body: |
            ### OmniFinCalc Android APK Release
            Download and install `OmniFinCalc.apk` below on any Android device to test the app.

            #### Included Features:
            - **Finance Dashboard & Reports**: Live net balance, income vs. expenses, category breakdown, savings trends, budget progress, upcoming bills, and CSV/PDF reports.
            - **Accounts, Debts, Loans & Split Bill**: Bank/Cash/Credit Card accounts, atomic transfers, active loan EMI tracking, personal debt ledger, and multi-group bill splitting.
            - **EMI, Investment & Interest Calculators**: Amortization schedules, prepayment simulations, SIP, Step-Up SIP, Lump Sum, Goal Planner, PPF, FD, and all 5 interest calculators.
            - **Tax, Salary & Daily Utilities**: Old vs. New Income Tax, In-Hand Salary, GST, Currency & Unit Converters, Scientific Calculator, and Age & Calendar tools.
          files: |
            release-artifacts/OmniFinCalc.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
